<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Great & Little — the two ends of the bar.
       One small dot, one large, on a shared rail. The whole idea of the
       site in the least possible ink. -->
  <rect width="64" height="64" rx="12" fill="#160E1B"/>
  <rect x="10" y="31" width="44" height="2" fill="#402A48"/>
  <circle cx="17" cy="32" r="3.5" fill="#C9A24E"/>
  <circle cx="46" cy="32" r="11" fill="none" stroke="#C9A24E" stroke-width="2.5"/>
</svg>
