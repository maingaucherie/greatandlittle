# ============================================================================
# Sveltia CMS configuration
#
# This file describes what you can edit and which fields each thing has.
# The CMS reads it, draws the matching forms, and writes markdown files
# into your repo when you hit publish.
#
# Adding a field here makes it appear in the editor immediately. Using that
# field on the page is a separate step — edit the matching template in
# src/_includes/.
# ============================================================================

# --- Where content is stored ------------------------------------------------
backend:
  name: github
  repo: maingaucherie/greatandlittle   # <-- change this
  branch: main
  # The OAuth worker that lets "Log in with GitHub" work. See the README for
  # the ten-minute setup; without it the login button does nothing.
  base_url: greatandlittle.maingaucherie.workers.dev   # <-- change this

# Lets you run the CMS against local files during development.
# With this on, `npx eleventy --serve` plus visiting /admin/ opens a folder
# picker instead of asking for GitHub — nothing is committed.
local_backend: true

# Where uploaded images go, and the path used to reference them in markdown.
media_folder: "src/uploads"
public_folder: "/uploads"

# Publishing mode. "simple" commits straight to main and the site rebuilds.
# Change to "editorial_workflow" if you'd rather posts sit as drafts in a
# pull request until you approve them.
publish_mode: simple

collections:

  # ==========================================================================
  # POSTS — everything except On Screen reviews
  # ==========================================================================
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/posts
    create: true
    # The filename. {{year}}-{{month}}-{{day}}-{{slug}} gives you
    # 2026-08-17-fixing-the-z2.md — sortable and readable.
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # What the entry list in the CMS shows for each post.
    summary: "{{title}}  ·  {{section}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }

      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD",
          date_format: "DD MMMM YYYY", time_format: false }

      # Which section the post files under. These values must match the
      # "key" values in src/_data/sections.json.
      - name: section
        label: Section
        widget: select
        default: void
        options:
          - { label: "Optics", value: optics }
          - { label: "The Bench", value: bench }
          - { label: "Life", value: life }
          - { label: "Overhead", value: sky }
          - { label: "The Void", value: void }

      - { name: summary, label: Summary, widget: text, required: false,
          hint: "One or two lines. Shown under the title and in section lists." }

      # Posts sharing a series value are grouped together under a heading
      # on the section page. Leave empty for one-off posts.
      - { name: series, label: Series, widget: string, required: false,
          hint: "e.g. Lamp restoration. Posts with the same series are grouped together." }

      - { name: topics, label: Topics, widget: list, required: false,
          hint: "Free-form tags. Each gets its own page at /topics/name/." }

      - { name: body, label: Body, widget: markdown }

  # ==========================================================================
  # REVIEWS — the On Screen section. Same as a post plus the scorecard.
  # ==========================================================================
  - name: reviews
    label: On Screen
    label_singular: Review
    folder: src/reviews
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}  ·  {{year}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string,
          hint: "Usually the film or show, plus the scene if it needs one." }

      - { name: date, label: Published, widget: datetime, format: "YYYY-MM-DD",
          date_format: "DD MMMM YYYY", time_format: false }

      - { name: year, label: Year of release, widget: number,
          required: false, value_type: int, min: 1890, max: 2100 }

      - { name: instrument, label: Instrument identified, widget: string,
          required: false,
          hint: "What it actually is, as best you can tell. e.g. Olympus BH-2, c. 1980" }

      - { name: summary, label: Summary, widget: text, required: false }

      - { name: cover, label: Cover art, widget: image, required: false,
          hint: "Poster or key art. Shown framed at the top of the review." }
      - { name: coverCaption, label: Cover caption, widget: string, required: false }

      # The three scoring axes. Keeping them identical on every entry is what
      # makes a ranking page possible later.
      - name: scores
        label: Scores
        widget: object
        fields:
          - { name: instrument, label: "Right instrument for the setting",
              widget: number, value_type: int, min: 0, max: 10, default: 5 }
          - { name: usage, label: "Used correctly",
              widget: number, value_type: int, min: 0, max: 10, default: 5 }
          - { name: plausibility, label: "Could they see that",
              widget: number, value_type: int, min: 0, max: 10, default: 5 }

      - { name: body, label: Body, widget: markdown }

      # Stills from the production, each with its own line of commentary.
      - name: gallery
        label: Stills
        widget: list
        required: false
        label_singular: Still
        summary: "{{fields.caption}}"
        fields:
          - { name: image, label: Image, widget: image }
          - { name: caption, label: Commentary, widget: text,
              hint: "One or two sentences on what this frame shows." }
          - { name: alt, label: Alt text, widget: string, required: false,
              hint: "Description for screen readers. Defaults to the commentary." }

      - { name: topics, label: Topics, widget: list, required: false }

  # ==========================================================================
  # SETTINGS — single files rather than a folder of many entries
  # ==========================================================================
  - name: settings
    label: Settings
    files:

      - name: site
        label: Site details
        file: src/_data/site.json
        fields:
          - { name: title, label: Site title, widget: string }
          - { name: domain, label: Domain, widget: string }
          - { name: url, label: Full URL, widget: string }
          - { name: tagline, label: Tagline, widget: text }
          - { name: status, label: Footer status line, widget: string }
          - { name: place, label: Footer place, widget: string }
          - { name: railLeft, label: Scale bar — left caption, widget: string }
          - { name: railRight, label: Scale bar — right caption, widget: string }

          # --- Display switches. See OPTIONS.md for what each one does. ---
          - name: options
            label: Options
            widget: object
            collapsed: true
            fields:
              - { name: showEyebrow, label: "Show domain above the wordmark", widget: boolean, default: false }
              - { name: showTagline, label: "Show tagline", widget: boolean, default: true }
              - { name: showRailEnds, label: "Show scale bar end captions", widget: boolean, default: true }
              - { name: showSectionList, label: "Show section list under the bar", widget: boolean, default: true,
                  hint: "Keep this on — it is the navigation on phones." }
              - { name: showTickMarks, label: "Show tick marks", widget: boolean, default: true }
              - { name: stickyHeader, label: "Sticky header on every page", widget: boolean, default: true }
              - { name: headerOnHome, label: "Header on the homepage too", widget: boolean, default: false }
              - { name: headerWordmark, label: "Header wordmark", widget: string, default: "G&L" }
              - { name: animateOnLoad, label: "Animate on load", widget: boolean, default: true }
              - { name: centreShortPages, label: "Vertically centre short pages", widget: boolean, default: true }
              - { name: footerLeft, label: "Footer left text", widget: select, default: status,
                  options: [{ label: "Status line", value: status }, { label: "Domain", value: domain }] }
              - { name: showFeedLink, label: "Advertise the Atom feed", widget: boolean, default: true }

          # --- Colours and fonts. Colour pickers write hex values. ---
          - name: theme
            label: Theme
            widget: object
            collapsed: true
            fields:
              - { name: pitch, label: "Background — darkest", widget: color }
              - { name: ground, label: "Background — mid", widget: color }
              - { name: aubergine, label: "Background — lightest (top glow)", widget: color }
              - { name: raised, label: "Raised (ticks, inactive dots)", widget: color }
              - { name: ink, label: "Text — primary", widget: color }
              - { name: inkSoft, label: "Text — muted", widget: color }
              - { name: rule, label: "Hairlines and borders", widget: color }
              - { name: brass, label: "Accent", widget: color }
              - { name: measure, label: "Max content width", widget: string, default: "64rem" }
              - { name: displayFont, label: "Display font", widget: string,
                  hint: "Also update the Google Fonts link in base.njk if you change this." }
              - { name: bodyFont, label: "Body font", widget: string }
              - { name: monoFont, label: "Mono font", widget: string }
              - { name: wonk, label: "Fraunces WONK (0 or 1)", widget: number, value_type: int, min: 0, max: 1 }
              - { name: soft, label: "Fraunces SOFT (0-100)", widget: number, value_type: int, min: 0, max: 100 }

      - name: sections
        label: Sections and scale bar
        file: src/_data/sections.json
        fields:
          - name: list
            label: Sections
            widget: list
            # Drag to reorder; order here is the order on the homepage list.
            fields:
              - { name: key, label: "Key (also the URL and folder name)", widget: string,
                  hint: "Lowercase, no spaces. Changing this changes the section's URL." }
              - { name: name, label: Display name, widget: string }
              - name: at
                label: "Sits at 10^ … metres"
                widget: number
                value_type: float
                min: -10
                max: 26
                step: 1
                required: false
                hint: >-
                  Just the exponent — -6 means 10⁻⁶ m. Reference points:
                  -10 atom · -9 DNA helix · -8 virus · -7 wavelength of light ·
                  -6 bacterium · -5 red blood cell · -4 human hair · -3 grain of sand ·
                  -2 fingernail · 0 a person · 1 a house · 3 a kilometre · 4 a small town ·
                  7 the Earth · 9 the Sun · 11 one AU · 16 one light year ·
                  21 the Milky Way · 23 galaxy clusters · 26 the observable universe.
                  Leave empty for off-scale sections. Two markers closer than about
                  2 apart will have their labels overlap.
              - { name: blurb, label: "Blurb (homepage list)", widget: text }
              - { name: intro, label: "Intro (section page)", widget: text }
              - { name: empty, label: "Empty-state text", widget: text,
                  hint: "Shown when the section has no posts yet." }
              - name: zone
                label: Position
                widget: select
                default: ""
                hint: "On the bar means it has a physical scale, set below. Off-scale sections park past either end for things with no size."
                options:
                  - { label: "On the ruled bar", value: "" }
                  - { label: "Off-scale — Discrete (left)", value: "discrete" }
                  - { label: "Off-scale — Unbound (right)", value: "unbound" }
              - { name: reviews, label: "This section holds scored reviews", widget: boolean,
                  default: false,
                  hint: "Exactly one section should have this on. It lists reviews with their scores instead of ordinary posts, and every review files itself here automatically." }
              - { name: simulation, label: "Show the simulation embed", widget: boolean,
                  default: false,
                  hint: "Puts the Life stage and its buttons above this section's post list." }
              - { name: hidden, label: "Hide from navigation", widget: boolean,
                  default: false,
                  hint: "Removes it from the scale bar and the homepage list. The page still exists and works by direct link." }

      - name: appearance
        label: Appearance
        file: src/_data/options.json
        fields:

          - name: typography
            label: Typography
            widget: object
            fields:
              - name: display
                label: Display face
                widget: select
                hint: "The serif used for the wordmark, section names and headings. Body and label faces stay as IBM Plex."
                default: Fraunces
                options:
                  - Fraunces
                  - Newsreader
                  - Instrument Serif
                  - Young Serif
                  - Spectral
                  - Bodoni Moda
                  - Playfair Display
                  - IBM Plex Serif
              - name: displayScale
                label: Heading size
                widget: number
                value_type: float
                min: 0.7
                max: 1.4
                step: 0.05
                default: 1
                hint: "Multiplier for the big headings. 1 is the design default; different faces read larger or smaller at the same size."

          - name: nav
            label: Header scale bar
            widget: object
            fields:
              - { name: show, label: "Show the header", widget: boolean, default: true }
              - { name: showOnHome, label: "Also show it on the homepage", widget: boolean, default: false }
              - { name: showLabels, label: "Show section names", widget: boolean, default: true }
              - { name: sticky, label: "Stick to the top when scrolling", widget: boolean, default: true }
              - { name: markCurrent, label: "Highlight the current section", widget: boolean, default: true }

          - name: home
            label: Homepage
            widget: object
            fields:
              - { name: showEyebrow, label: "Show the domain above the title", widget: boolean, default: false }
              - { name: showRailCaptions, label: "Show the captions under the scale bar", widget: boolean, default: true }
              - { name: tickCount, label: "Number of tick marks", widget: number, value_type: int, min: 6, max: 72, default: 18 }
              - { name: majorEvery, label: "Every Nth tick is taller", widget: number, value_type: int, min: 2, max: 12, default: 3 }

          - name: entries
            label: Post lists
            widget: object
            fields:
              - { name: showSummaries, label: "Show summaries under titles", widget: boolean, default: true }
              - { name: showFeed, label: "Advertise the RSS feed", widget: boolean, default: true }

          - name: motion
            label: Motion
            widget: object
            fields:
              - { name: enabled, label: "Animations", widget: boolean, default: true }

      - name: rubric
        label: Review rubric
        file: src/_data/rubric.json
        fields:
          - name: axes
            label: Scoring axes
            widget: list
            fields:
              - { name: key, label: "Key (do not change on existing axes)", widget: string }
              - { name: label, label: "Label shown on reviews", widget: string }
              - { name: hint, label: "What this axis measures", widget: text, required: false }

      - name: scale
        label: Scale bands and lens
        file: src/_data/scale.json
        fields:

          - name: lens
            label: Fisheye lens
            widget: object
            hint: "The magnifier that follows your pointer along the bar."
            fields:
              - { name: enabled, label: "Lens on", widget: boolean, default: true,
                  hint: "Off gives a plain linear bar. Visitors who ask for reduced motion get that automatically." }
              - { name: width, label: "Lens width (decades)", widget: number,
                  value_type: float, min: 0.5, max: 12, step: 0.5, default: 1.5,
                  hint: "How far the magnification spreads. Small is a tight loupe; large is a gentle swell." }
              - { name: strength, label: "Strength", widget: number,
                  value_type: float, min: 0.5, max: 5, step: 0.1, default: 1.5,
                  hint: "Peak magnification. Total width is fixed, so more here means more compression elsewhere." }
              - { name: snap, label: "Marker grab distance (px)", widget: number,
                  value_type: int, min: 0, max: 120, default: 44,
                  hint: "How close the pointer must get before a section marker locks the lens so it holds still to be clicked. 0 disables." }

          - name: zones
            label: Off-scale zones
            widget: object
            hint: "The regions past either end of the bar, for sections with no physical scale."
            fields:
              - { name: show, label: "Show the zones", widget: boolean, default: true }
              - { name: width, label: "Zone width (percent of the bar)", widget: number,
                  value_type: int, min: 6, max: 25, default: 13 }
              - name: discrete
                label: "Left zone — below resolution"
                widget: object
                fields:
                  - { name: name, label: Name, widget: string, default: Discrete }
                  - { name: caption, label: Caption under the bar, widget: string, default: "below resolution" }
              - name: unbound
                label: "Right zone — beyond bound"
                widget: object
                fields:
                  - { name: name, label: Name, widget: string, default: Unbound }
                  - { name: caption, label: Caption under the bar, widget: string, default: "beyond bound" }

          - { name: low, label: "Bar starts at 10^", widget: number, value_type: int, default: -10 }
          - { name: high, label: "Bar ends at 10^", widget: number, value_type: int, default: 26 }

          - name: bands
            label: Size domains
            widget: list
            summary: "{{fields.name}}  ·  10^{{fields.from}} to 10^{{fields.to}}"
            hint: "Must be contiguous and cover the whole bar — each band's start should equal the previous one's end."
            fields:
              - { name: name, label: Name, widget: string,
                  hint: "Short single words work best. Long labels hide themselves when a band is too narrow." }
              - { name: from, label: "From 10^", widget: number, value_type: float }
              - { name: to, label: "To 10^", widget: number, value_type: float }
              - { name: weight, label: Brightness, widget: number,
                  value_type: float, min: 0.05, max: 1, step: 0.02,
                  hint: "0.05 is barely visible, 1 is solid brass. Currently brightest at human scale, fading toward both ends." }

